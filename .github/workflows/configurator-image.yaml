name: Configurator image

on:
  pull_request:
  push:
    branches:
      - demo/jiyugaoka_deployment

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: configurator/pyproject.toml
      - name: Install configurator
        run: python -m pip install './configurator[test]'
      - name: Unit tests
        run: pytest configurator/tests
      - name: Shell validation
        run: shellcheck setup.sh start.sh run.sh stop.sh scripts/compose.sh
      - name: Compose validation
        run: bash scripts/validate_compose.sh

  # ros2-ci is private while this repository is public. GitHub rejects private
  # reusable-workflow calls from public callers before jobs are created. Keep
  # this aligned with ros2-ci/build-container.yml until a public entrypoint exists.
  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/haru-project/apps-configurator
          tags: |
            type=sha,format=long
            type=raw,value=demo-jiyugaoka,enable=${{ github.event_name == 'push' }}
      - uses: docker/build-push-action@v7
        with:
          context: configurator
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root daemon access
        if: github.event_name != 'push'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --group-add "$(stat -c '%g' /var/run/docker.sock)"
          -v /var/run/docker.sock:/var/run/docker.sock
          --entrypoint python
          ghcr.io/haru-project/apps-configurator:sha-${{ github.sha }}
          -c 'import docker; assert docker.from_env().ping()'
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/haru-project/apps-configurator:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload scan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

name: Runtime validation

on:
  pull_request:
  push:
    branches:
      - demo/jiyugaoka_deployment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tools
        run: python -m pip install pytest==8.4.1
      - name: Runtime configuration tests
        run: pytest tests
      - name: Compose validation
        run: bash scripts/validate_compose.sh
      - name: Shell validation
        run: shellcheck -e SC1091 start.sh run.sh stop.sh scripts/compose.sh scripts/validate_compose.sh scripts/download_*.sh

  # This public repository cannot call the private ros2-ci reusable workflows.
  # Replace this job with a commit-pinned ros2-ci call when a public entrypoint exists.

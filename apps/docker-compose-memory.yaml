name: agent-memory

services:
  agent-memory-t2v:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${AGENT_MEMORY_T2V_IMAGE:-ghcr.io/haru-project/agent-memory-t2v:latest}
    environment:
      ENABLE_CUDA: "${AGENT_MEMORY_T2V_ENABLE_CUDA:-0}"
    restart: unless-stopped

  agent-memory-weaviate:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${AGENT_MEMORY_WEAVIATE_IMAGE:-semitechnologies/weaviate:1.28.0}
    ports:
      - "${AGENT_MEMORY_WEAVIATE_HTTP_PORT:-8082}:8080"
      - "${AGENT_MEMORY_WEAVIATE_GRPC_PORT:-50052}:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "text2vec-transformers"
      ENABLE_MODULES: "text2vec-transformers"
      TRANSFORMERS_INFERENCE_API: "http://agent-memory-t2v:8080"
      CLUSTER_HOSTNAME: "agent-memory-node"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - agent_memory_weaviate_data:/var/lib/weaviate
    depends_on:
      - agent-memory-t2v
    restart: unless-stopped

  # Local LLM service for agent-memory jobs, bound to localhost:${AGENT_MEMORY_OLLAMA_PORT:-11434}
  # (propagated to agent-memory via OLLAMA_BASE_URL). First launch auto-pulls and loads qwen3.5:4b
  # (~3.4 GB) into the volume, emitting "MEMORY_METRIC llm_ready".
  # Gated by AGENT_MEMORY_LLM_BACKEND=ollama (triggers the "memory-ollama" Compose profile in
  # scripts/compose.sh); skipped by default under litellm profile.
  agent-memory-ollama:
    profiles: ["memory-ollama"]
    extends:
      file: compose.common.yaml
      service: common-gpu
    image: ${AGENT_MEMORY_OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "${AGENT_MEMORY_OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - agent_memory_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  agent-memory:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${AGENT_MEMORY_ROS_IMAGE:-ghcr.io/haru-project/agent-memory-ros:latest}
    network_mode: host
    # The node waits up to 20 s on shutdown for an in-flight fact extraction to land, so anything
    # shorter than that SIGKILLs it mid-extraction and loses the last session's facts. A node with
    # nothing in flight still exits immediately, so this costs nothing in the common case.
    stop_grace_period: 25s
    env_file: ../envs/memory.env
    environment:
      ROS_DOMAIN_ID: "${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      FASTDDS_BUILTIN_TRANSPORTS: "${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}"
      WEAVIATE_HOST: "localhost"
      WEAVIATE_PORT: "${AGENT_MEMORY_WEAVIATE_HTTP_PORT:-8082}"
      WEAVIATE_GRPC_PORT: "${AGENT_MEMORY_WEAVIATE_GRPC_PORT:-50052}"
      CONFIG_FILE: "${AGENT_MEMORY_CONFIG_FILE:-/shared/configs/agent_memory.yaml}"
      # Ignored unless the effective provider is Ollama, so it can stay set in either backend.
      OLLAMA_BASE_URL: "http://localhost:${AGENT_MEMORY_OLLAMA_PORT:-11434}"
      # Overrides the mounted YAML's memory_optimization configuration.
      # Under AGENT_MEMORY_LLM_BACKEND=ollama, scripts/compose.sh exports these as empty strings;
      # the "-" (not ":-") default ensures set-but-empty values preserve YAML endpoints rather
      # than falling through to proxy defaults. Direct definitions in envs/memory.env take precedence.
      MEMORY_LLM_PROVIDER: "${MEMORY_LLM_PROVIDER-openai}"
      MEMORY_LLM_SERVER_URL: "${MEMORY_LLM_SERVER_URL-${AGENT_MEMORY_LITELLM_URL:-http://127.0.0.1:4050/v1}}"
      MEMORY_LLM_MODEL: "${MEMORY_LLM_MODEL-${AGENT_MEMORY_LITELLM_MODEL:-haru:canonical}}"
    volumes:
      - "../data/memory/configs/agent_memory.yaml:${AGENT_MEMORY_CONFIG_FILE:-/shared/configs/agent_memory.yaml}:ro"
    # Omits depends_on for agent-memory-ollama to prevent Compose validation errors
    # when the service is profile-disabled under the litellm backend.
    # Safe to omit: agent-memory retries the LLM endpoint every 30s until ready.
    depends_on:
      agent-memory-weaviate:
        condition: service_healthy
    restart: unless-stopped

  agent-memory-dashboard:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${AGENT_MEMORY_DASHBOARD_IMAGE:-ghcr.io/haru-project/agent-memory-dashboard:latest}
    profiles: ["memory-dashboard"]
    ports:
      - "${AGENT_MEMORY_DASHBOARD_PORT:-8502}:8500"
    environment:
      WEAVIATE_URL: "http://agent-memory-weaviate:8080"
    depends_on:
      agent-memory-weaviate:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent_memory_weaviate_data:
  agent_memory_ollama_models:

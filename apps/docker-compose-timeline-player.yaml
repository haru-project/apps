name: haru-timeline-player

services:
  timeline-player:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${TIMELINE_PLAYER_IMAGE:-ghcr.io/haru-project/haru-timeline-player@sha256:eca2d39f0a1c3077f1093aebab978c1d54f1ba868f9314685b523cc4b9e5a558}
    network_mode: host
    ipc: host
    env_file: ../envs/timeline-player.env
    command: bash -c "source /opt/ros/jazzy/workspace/install/setup.bash && ros2 launch haru_timeline_player timeline_player.launch.py"
    healthcheck:
      test: ["CMD-SHELL", "source /opt/ros/jazzy/workspace/install/setup.bash && ros2 action list | grep -qx /haru2/play_timeline"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped
    profiles: ["timeline-compat"]

  dev:
    image: ${TIMELINE_PLAYER_IMAGE:-ghcr.io/haru-project/haru-timeline-player@sha256:eca2d39f0a1c3077f1093aebab978c1d54f1ba868f9314685b523cc4b9e5a558}
    network_mode: host
    ipc: host
    env_file: ../envs/timeline-player.env
    volumes:
      - ../docker/deps:/workspace/src:cached
      - ..:/workspace/src/haru_timeline_player:cached
      - ~/.ssh:/root/.ssh:ro
    command: sleep infinity
    profiles: ["dev"]

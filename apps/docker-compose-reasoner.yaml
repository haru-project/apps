name: haru-reasoner

services:
  bt-forest:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_REASONER_IMAGE:-ghcr.io/haru-project/haru-agent-reasoner:feature-expressive_multitts}
    command: [
      "ros2", "launch", "haru_agent_reasoner", "haru_controllers.launch.py",
      "expressivity_controller_enabled:=${EXPRESSIVITY_CONTROLLER_ENABLED:-true}",
      "gaze_controller_enabled:=${GAZE_CONTROLLER_ENABLED:-true}",
      "ipad_students_controller_enabled:=${IPAD_STUDENTS_CONTROLLER_ENABLED:-false}",
      "ipad_teacher_controller_enabled:=${IPAD_TEACHER_CONTROLLER_ENABLED:-false}",
      "unity_controller_enabled:=${UNITY_CONTROLLER_ENABLED:-false}",
      "groot_monitor_enabled:=${GROOT_MONITOR_ENABLED:-true}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/reasoner.env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/session/:/root/.bt_ros:rw
    restart: unless-stopped

  reasoner:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_REASONER_IMAGE:-ghcr.io/haru-project/haru-agent-reasoner:feature-expressive_multitts}
    command: [
      "ros2", "launch", "haru_agent_reasoner", "haru_reasoner.launch.py",
      "reactive_rules_file_path:=${REACTIVE_RULES_FILE}",
      "config_file:=${REASONER_CONFIG_FILE:-/opt/ros/jazzy/workspace/install/share/haru_agent_reasoner/examples/configs/ConfigJap0.json}",
      "enable_reactive:=true",
      "dev_autostart:=true",
    ]
    env_file: ../envs/reasoner.env
    volumes:
      - ../data/reasoner/configs:/shared/configs:rw
      - ../data/reasoner/tasks:/shared/tasks:rw
    restart: unless-stopped

  context-manager:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_REASONER_IMAGE:-ghcr.io/haru-project/haru-agent-reasoner:feature-expressive_multitts}
    command: [
      "ros2", "launch", "haru_agent_reasoner", "haru_context.launch.py",
      "model_file:=${WORLD_MODEL_FILE}",
      "plansys2_params_file:=${PLANSYS2_CONFIG_FILE}",
      "postprocessors_params_file:=${POSTPROCESSORS_CONFIG_FILE}",
      "start_perception_postprocessors:=true",
      "context_backup_active:=true",
      "context_backup_path:='/tmp/haru_agent_reasoner/context.backup'",
      "dev_autostart:=true",
    ]
    env_file: ../envs/reasoner.env
    volumes:
      - ../data/reasoner/tmp:/tmp/haru_agent_reasoner:rw
      - ../data/reasoner/configs:/shared/configs:rw

  execute-task-scenario:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_REASONER_IMAGE:-ghcr.io/haru-project/haru-agent-reasoner:feature-expressive_multitts}
    command: [
      "ros2", "action", "send_goal", "/haru_agent/new_task_raw", "haru_agent_reasoner_msgs/action/TriggerTaskExecutionRaw",
      "{json_filepath: '/shared/tasks/${TASK_SCENARIO_FILE}', task_type: 1}",
      "-f",
    ]
    env_file: ../envs/reasoner.env
    depends_on:
      - reasoner
      - context-manager
    restart: "no"
    profiles: ["scenario"]

  execute-task-test:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_REASONER_IMAGE:-ghcr.io/haru-project/haru-agent-reasoner:feature-expressive_multitts}
    command: [
      "ros2", "action", "send_goal", "/haru_agent/new_task_raw", "haru_agent_reasoner_msgs/action/TriggerTaskExecutionRaw",
      "{json_filepath: '/shared/tasks/${TASK_TEST_FILE}', task_type: 1}",
      "-f",
    ]
    env_file: ../envs/reasoner.env
    depends_on:
      - reasoner
    restart: "no"
    profiles: ["test"]

  evaluate:
    extends:
      file: compose.common.yaml
      service: common-ros
    tty: true
    stdin_open: true
    command: sleep infinity
    image: ${ROS:-ghcr.io/haru-project/haru-os:feature-haru2-core}
    env_file: ../envs/reasoner.env
    restart: "no"
    profiles: ["evaluation"]
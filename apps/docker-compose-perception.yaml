# Project name used when docker compose creates the project
name: haru-perception

# Top-level extension fields to deduplicate repeated blocks
x-nvidia-device: &nvidia-device
  driver: nvidia
  count: all
  capabilities: [gpu]

x-gpu-reservations: &gpu-reservations
  resources:
    reservations:
      devices:
        - <<: *nvidia-device

x-common-x11: &common-x11 "/tmp/.X11-unix:/tmp/.X11-unix:rw"

x-common-docker-xauth: &common-docker-xauth "/tmp/.docker.xauth:/tmp/.docker.xauth"

x-common-dev: &common-dev "/dev:/dev:rw"

# Common ROS shutdown behavior
x-common-ros: &common-ros
  init: true
  stop_grace_period: 10s

# Centralized network mode — can be overridden with COMPOSE_NETWORK_MODE env var (e.g. bridge)
x-network-mode: &network-mode ${COMPOSE_NETWORK_MODE:-host}

services:
  # Azure Kinect sensor driver
  azure-kinect:
    image: ghcr.io/haru-project/strawberry-ros-azure-kinect:feature-topic-normalize
    env_file:
      - ../envs/perception.env
    environment:
      DISPLAY: ${DISPLAY}
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: AZURE_KINECT
      AZURE_KINECT_DEV_AUTOSTART: "true"
      AZURE_KINECT_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect
      AZURE_KINECT_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1
    network_mode: *network-mode
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros

  # Skeleton pipeline
  skeletons:
    image: ghcr.io/haru-project/strawberry-ros-skeletons:feature-topic-normalize
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: SKELETONS
      SKELETONS_DEV_AUTOSTART: "true"
      SKELETONS_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      SKELETONS_RGB_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/rgb/image_raw/compressed
      SKELETONS_DEPTH_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/depth_to_rgb/image_raw
      SKELETONS_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/depth_to_rgb/camera_info
      SKELETONS_OUTPUT_TOPIC_2D: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons/detections_2d
      SKELETONS_OUTPUT_TOPIC_3D: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons/detections_3d
      SKELETONS_OUTPUT_TOPIC_SKELETONS: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons/results
      SKELETONS_OUTPUT_TOPIC_DEBUG_OVERLAY: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons/internal/debug/overlay/compressed
      SKELETONS_OUTPUT_TOPIC_DEBUG_OVERLAY_RAW: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons/internal/debug/overlay
      SKELETONS_OUTPUT_TOPIC_METRICS: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons/internal/metrics
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Faces (InsightFace + fusion node)
  faces:
    image: ghcr.io/haru-project/strawberry-ros-faces-module:feature-topic-normalize
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: FACES
      FACES_DEV_AUTOSTART: "true"
      FACES_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      FACES_IMAGE_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/rgb/image_raw
      FACES_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/rgb/camera_info
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/perception
        target: /ros/strawberry_ros_faces_module
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Hands module
  hands:
    image: ghcr.io/haru-project/strawberry-ros-hands:feature-topic-normalize
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: HANDS
      HANDS_DEV_AUTOSTART: "true"
      HANDS_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      HANDS_CAMERA_NAME: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/rgb
      HANDS_IMAGE_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/rgb/image_raw/compressed
      HANDS_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/rgb/camera_info
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Belief authority (default perception fusion output)
  haru-belief:
    image: ghcr.io/haru-project/haru-belief:feature-topic-normalize
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: HARU_BELIEF
      HARU_BELIEF_DEV_AUTOSTART: "true"
      HARU_BELIEF_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/belief
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros
    depends_on:
      skeletons:
        condition: service_started
      faces:
        condition: service_started
      hands:
        condition: service_started

  # Resource monitor (optional; no GPU usage required but kept here for convenience)
  resource-monitor:
    image: ghcr.io/haru-project/strawberry-resource-monitor:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

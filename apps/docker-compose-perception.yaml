# Project name used when docker compose creates the project
name: haru-perception

# Top-level extension fields to deduplicate repeated blocks
x-nvidia-device: &nvidia-device
  driver: nvidia
  count: all
  capabilities: [gpu]

x-gpu-reservations: &gpu-reservations
  resources:
    reservations:
      devices:
        - <<: *nvidia-device

x-common-x11: &common-x11 "/tmp/.X11-unix:/tmp/.X11-unix:rw"

x-common-docker-xauth: &common-docker-xauth "/tmp/.docker.xauth:/tmp/.docker.xauth"
x-common-root-xauth: &common-root-xauth "${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro"

x-common-dev: &common-dev "/dev:/dev:rw"
x-common-run: &common-run "/run:/run:rw"

# Common ROS shutdown behavior
x-common-ros: &common-ros
  init: true
  stop_grace_period: 10s

# Centralized network mode — can be overridden with COMPOSE_NETWORK_MODE env var (e.g. bridge)
x-network-mode: &network-mode ${COMPOSE_NETWORK_MODE:-host}

services:
  # Azure Kinect sensor driver
  # Replay-only usage: leave this service stopped and start the consumers with
  # `PERCEPTION_USE_SIM_TIME=true`. Replay still requires recorded `/tf` and
  # `/tf_static` so belief can reconstruct world/camera transforms.
  azure-kinect:
    image: ${AZURE_KINECT_IMAGE:-ghcr.io/haru-project/strawberry-ros-azure-kinect:feature-topic-normalize}
    env_file:
      - ../envs/perception.env
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /root/.Xauthority
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: AZURE_KINECT
      AZURE_KINECT_DEV_AUTOSTART: "true"
      AZURE_KINECT_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect
      AZURE_KINECT_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1
    network_mode: *network-mode
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-root-xauth
      - *common-dev
      - *common-run
    <<: *common-ros

  # Skeleton pipeline
  skeletons:
    image: ${SKELETONS_IMAGE:-ghcr.io/haru-project/strawberry-ros-skeletons:feature-topic-normalize}
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: SKELETONS
      SKELETONS_DEV_AUTOSTART: "true"
      SKELETONS_USE_SIM_TIME: ${PERCEPTION_USE_SIM_TIME:-false}
      SKELETONS_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      SKELETONS_RGB_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb
      SKELETONS_DEPTH_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/depth_to_rgb
      SKELETONS_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb/camera_info
      SKELETONS_OUTPUT_TOPIC_SKELETONS: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

  # Faces (InsightFace + fusion node)
  faces:
    image: ${FACES_IMAGE:-ghcr.io/haru-project/strawberry-ros-faces-module:feature-topic-normalize}
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: FACES
      FACES_DEV_AUTOSTART: "true"
      FACES_USE_SIM_TIME: ${PERCEPTION_USE_SIM_TIME:-false}
      FACES_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      FACES_RGB_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb
      FACES_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb/camera_info
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/perception
        target: /ros/strawberry_ros_faces_module
    <<: *common-ros
    deploy: *gpu-reservations
  # Hands module
  hands:
    image: ${HANDS_IMAGE:-ghcr.io/haru-project/strawberry-ros-hands:latest}
    env_file:
      - ../envs/perception.env
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /root/.Xauthority
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: HANDS
      HANDS_DEV_AUTOSTART: "true"
      HANDS_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      HANDS_CAMERA_NAME: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb
      HANDS_IMAGE_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb/compressed
      HANDS_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/kinect/cam_1/rgb/camera_info
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-root-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
  # Belief authority (default perception fusion output)
  haru-belief:
    image: ${HARU_BELIEF_IMAGE:-ghcr.io/haru-project/haru-belief:feature-topic-normalize}
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: HARU_BELIEF
      HARU_BELIEF_DEV_AUTOSTART: "true"
      HARU_BELIEF_USE_SIM_TIME: ${PERCEPTION_USE_SIM_TIME:-false}
      HARU_BELIEF_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/fusion
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros
  # haru-viz browser UI + rosbridge runtime
  haru-viz:
    image: ${HARU_VIZ_IMAGE:-ghcr.io/haru-project/haru-viz:feature-topic-normalize}
    env_file:
      - ../envs/perception.env
    environment:
      HARU_VIZ_DEV_AUTOSTART: "true"
      HARU_VIZ_REPO_ROOT: ${HARU_VIZ_REPO_ROOT:-/workspace/haru-viz}
      HARU_VIZ_UI_HOST: ${HARU_VIZ_UI_HOST:-0.0.0.0}
      HARU_VIZ_UI_PORT: ${HARU_VIZ_UI_PORT:-5173}
      HARU_ROSBRIDGE_PORT: ${HARU_ROSBRIDGE_PORT:-9090}
      HARU_ROSBRIDGE_RGB_PORT: ${HARU_ROSBRIDGE_RGB_PORT:-9091}
      HARU_ROSBRIDGE_DEPTH_PORT: ${HARU_ROSBRIDGE_DEPTH_PORT:-9092}
      HARU_ROSBRIDGE_MAX_MESSAGE_SIZE: ${HARU_ROSBRIDGE_MAX_MESSAGE_SIZE:-8388608}
      VITE_ROSBRIDGE_URL: ws://127.0.0.1:${HARU_ROSBRIDGE_PORT:-9090}
      VITE_ROSBRIDGE_FORCE_AUTO_CONNECT: "1"
    network_mode: *network-mode
    restart: unless-stopped
    working_dir: /workspace/haru-viz
    command: ros2 launch haru_viz haru_viz.launch.py
    volumes:
      - type: bind
        source: ../../haru-viz
        target: /workspace/haru-viz
      - *common-dev
    <<: *common-ros
    depends_on:
      haru-belief:
        condition: service_started

  # Resource monitor (optional; no GPU usage required but kept here for convenience)
  resource-monitor:
    image: ${RESOURCE_MONITOR_IMAGE:-ghcr.io/haru-project/strawberry-resource-monitor:latest}
    env_file:
      - ../envs/perception.env
    environment:
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

# Project name used when docker compose creates the project
name: haru-perception

# Top-level extension fields to deduplicate repeated blocks
x-nvidia-device: &nvidia-device
  driver: nvidia
  count: all
  capabilities: [gpu]

x-gpu-reservations: &gpu-reservations
  resources:
    reservations:
      devices:
        - <<: *nvidia-device

x-common-x11: &common-x11 "/tmp/.X11-unix:/tmp/.X11-unix:rw"

x-common-docker-xauth: &common-docker-xauth "/tmp/.docker.xauth:/tmp/.docker.xauth"

x-common-dev: &common-dev "/dev:/dev:rw"

# Common ROS shutdown behavior
x-common-ros: &common-ros
  init: true
  stop_grace_period: 10s

# Centralized network mode — can be overridden with COMPOSE_NETWORK_MODE env var (e.g. bridge)
x-network-mode: &network-mode ${COMPOSE_NETWORK_MODE:-host}

services:
  # Azure Kinect sensor driver - supplies depth + color to downstream modules
  azure-kinect:
    image: ghcr.io/haru-project/strawberry-ros-azure-kinect:feature-skeleton-integration
    env_file:
      - ../envs/perception.env
    environment:
      DISPLAY: ${DISPLAY}
      HARU_PARAM_AUTO_PREFIXES: AZURE_KINECT
      AZURE_KINECT_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros

  # Skeletons pipeline (consumes Kinect sensor topics, publishes /strawberry/skeletons)
  skeletons:
    image: ghcr.io/haru-project/strawberry-ros-skeletons:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: SKELETONS
      SKELETONS_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Faces (InsightFace + fusion node)
  faces:
    image: ghcr.io/haru-project/strawberry-ros-faces-module:feature-skeleton-integration
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: FACES
      FACES_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/perception
        target: /ros/strawberry_ros_faces_module
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Skeleton (OpenPose + fusion node)
  skeletons:
    image: ghcr.io/haru-project/strawberry-ros-skeletons:feature-skeleton-integration
    env_file:
      - ../envs/perception.env
    environment:
      DISPLAY: ${DISPLAY} # Required by OpenPose even when no display is used
      XAUTHORITY: /root/.Xauthority
      HARU_PARAM_AUTO_PREFIXES: SKELETONS
      SKELETONS_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - *common-x11
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Hands module
  hands:
    image: ghcr.io/haru-project/strawberry-ros-hands:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: HANDS
      HANDS_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # People module
  people:
    image: ghcr.io/haru-project/strawberry-ros-people:feature-skeleton-integration
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: PEOPLE
      PEOPLE_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy
      skeletons:
        condition: service_started

  # Visualization nodes (RViz, GUI helpers)
  visualization:
    image: ghcr.io/haru-project/strawberry-ros-visualization:feature-skeleton-integration
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: VIZ
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      VIZ_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - type: bind
        source: ../data/perception/haru_recorder
        target: /root/.local/share/haru_recorder
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy
      faces:
        condition: service_healthy
      skeletons:
        condition: service_healthy
      hands:
        condition: service_healthy
      people:
        condition: service_healthy

  # Resource monitor (optional; no GPU usage required but kept here for convenience)
  resource-monitor:
    image: ghcr.io/haru-project/strawberry-resource-monitor:latest
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

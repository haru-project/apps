# Project name used when docker compose creates the project
name: haru-perception

# Top-level extension fields to deduplicate repeated blocks
x-nvidia-device: &nvidia-device
  driver: nvidia
  count: all
  capabilities: [ gpu ]

x-gpu-reservations: &gpu-reservations
  resources:
    reservations:
      devices:
        - <<: *nvidia-device

x-common-x11: &common-x11 "/tmp/.X11-unix:/tmp/.X11-unix:rw"

x-common-docker-xauth: &common-docker-xauth "/tmp/.docker.xauth:/tmp/.docker.xauth"
x-common-root-xauth: &common-root-xauth "${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro"

x-common-dev: &common-dev "/dev:/dev:rw"
x-kinect-usb-dev: &kinect-usb-dev "/dev/bus/usb:/dev/bus/usb:rw"
x-common-run: &common-run "/run:/run:rw"

# Common ROS shutdown behavior
x-common-ros: &common-ros
  init: true
  stop_grace_period: 10s

# Centralized network mode — can be overridden with COMPOSE_NETWORK_MODE env var (e.g. bridge)
x-network-mode: &network-mode ${COMPOSE_NETWORK_MODE:-host}

x-perception-domain-env: &perception-domain-env
  ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}

services:
  # Azure Kinect sensor driver
  # Replay-only usage: leave this service stopped and start the consumers with
  # `PERCEPTION_USE_SIM_TIME=true`. Replay still requires recorded `/tf` and
  # `/tf_static` so belief can reconstruct world/camera transforms.
  azure-kinect:
    image: ${AZURE_KINECT_IMAGE:-ghcr.io/haru-project/strawberry-ros-azure-kinect:feature-asr-improve}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /root/.Xauthority
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: AZURE_KINECT
      AZURE_KINECT_DEV_AUTOSTART: "true"
      AZURE_KINECT_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect
      AZURE_KINECT_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1
      AZURE_KINECT_AUDIO_ENABLED: ${AZURE_KINECT_AUDIO_ENABLED:-false}
      AZURE_KINECT_PUBLISH_AUDIO_OPUS: ${AZURE_KINECT_PUBLISH_AUDIO_OPUS:-false}
    network_mode: *network-mode
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-root-xauth
      - *kinect-usb-dev
      - *common-run
    <<: *common-ros
    deploy: *gpu-reservations

  # Compatibility feed for packages that still consume sensor_msgs/CompressedImage.
  rgb-compressed-republisher:
    image: ${AZURE_KINECT_IMAGE:-ghcr.io/haru-project/strawberry-ros-azure-kinect:feature-asr-improve}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      RGB_COMPRESSED_REPUBLISHER_INPUT_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/rgb
      RGB_COMPRESSED_REPUBLISHER_OUTPUT_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/rgb/compressed
      RGB_COMPRESSED_REPUBLISHER_JPEG_QUALITY: ${RGB_COMPRESSED_REPUBLISHER_JPEG_QUALITY:-85}
    network_mode: *network-mode
    restart: unless-stopped
    entrypoint: bash
    command:
      - -lc
      - |
        set +u
        source /opt/ros/jazzy/setup.bash
        source /opt/ros/jazzy/workspace/install/setup.bash 2>/dev/null || true
        python3 - <<'PY'
        import os

        import cv2
        import rclpy
        from cv_bridge import CvBridge
        from rclpy.qos import (
            DurabilityPolicy,
            HistoryPolicy,
            QoSProfile,
            ReliabilityPolicy,
        )
        from sensor_msgs.msg import CompressedImage, Image

        rclpy.init()
        node = rclpy.create_node("rgb_compressed_republisher")
        bridge = CvBridge()
        in_topic = os.environ["RGB_COMPRESSED_REPUBLISHER_INPUT_TOPIC"]
        out_topic = os.environ["RGB_COMPRESSED_REPUBLISHER_OUTPUT_TOPIC"]
        jpeg_quality = int(os.environ.get("RGB_COMPRESSED_REPUBLISHER_JPEG_QUALITY", "85"))

        sub_qos = QoSProfile(
            depth=5,
            reliability=ReliabilityPolicy.BEST_EFFORT,
            durability=DurabilityPolicy.VOLATILE,
            history=HistoryPolicy.KEEP_LAST,
        )
        pub_qos = QoSProfile(
            depth=5,
            reliability=ReliabilityPolicy.RELIABLE,
            durability=DurabilityPolicy.VOLATILE,
            history=HistoryPolicy.KEEP_LAST,
        )
        pub = node.create_publisher(CompressedImage, out_topic, pub_qos)

        def republish(msg):
            try:
                image = bridge.imgmsg_to_cv2(msg, desired_encoding="bgr8")
                ok, encoded = cv2.imencode(
                    ".jpg",
                    image,
                    [int(cv2.IMWRITE_JPEG_QUALITY), jpeg_quality],
                )
                if not ok:
                    node.get_logger().warning("JPEG encode failed")
                    return
                out = CompressedImage()
                out.header = msg.header
                out.format = "jpeg"
                out.data = encoded.tobytes()
                pub.publish(out)
            except Exception as exc:
                node.get_logger().error(f"failed to republish compressed image: {exc}")

        node.create_subscription(Image, in_topic, republish, sub_qos)
        node.get_logger().info(f"republishing {in_topic} -> {out_topic}")
        rclpy.spin(node)
        PY
    depends_on:
      azure-kinect:
        condition: service_started
    <<: *common-ros

  # Skeleton pipeline
  skeletons:
    image: ${SKELETONS_IMAGE:-ghcr.io/haru-project/strawberry-ros-skeletons:feature-asr-improve}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: SKELETONS
      SKELETONS_DEV_AUTOSTART: "true"
      SKELETONS_USE_SIM_TIME: ${PERCEPTION_USE_SIM_TIME:-false}
      SKELETONS_USE_FFMPEG_DECODE_BRIDGE: "false"
      SKELETONS_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      SKELETONS_RGB_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/rgb
      SKELETONS_DEPTH_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/depth_to_rgb
      SKELETONS_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/camera_info
      SKELETONS_OUTPUT_TOPIC_SKELETONS: ${HARU_TOPIC_PREFIX:-}/perception/proc/skeletons
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

  # Faces (InsightFace + fusion node)
  faces:
    image: ${FACES_IMAGE:-ghcr.io/haru-project/strawberry-ros-faces-module:feature-topic-normalize}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: FACES
      FACES_DEV_AUTOSTART: "true"
      FACES_USE_SIM_TIME: ${PERCEPTION_USE_SIM_TIME:-false}
      FACES_USE_FFMPEG_DECODE_BRIDGE: "false"
      FACES_DATA_ROOT: /ros/strawberry_ros_faces_module
      FACES_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      FACES_RGB_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/rgb
      FACES_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/camera_info
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/perception
        target: /ros/strawberry_ros_faces_module
    <<: *common-ros
    deploy: *gpu-reservations
  # Hands module
  hands:
    image: ${HANDS_IMAGE:-ghcr.io/haru-project/strawberry-ros-hands:latest}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /root/.Xauthority
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: HANDS
      HANDS_DEV_AUTOSTART: "true"
      HANDS_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/proc
      HANDS_CAMERA_NAME: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/rgb
      HANDS_IMAGE_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/rgb/compressed
      HANDS_CAMERA_INFO_TOPIC: ${HARU_TOPIC_PREFIX:-}/perception/sensor/camera/kinect/cam_1/camera_info
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-root-xauth
      - *common-dev
    <<: *common-ros
    depends_on:
      rgb-compressed-republisher:
        condition: service_started
    deploy: *gpu-reservations
  # Belief authority (default perception fusion output)
  haru-belief:
    image: ${HARU_BELIEF_IMAGE:-ghcr.io/haru-project/haru-belief:feature-asr-improve}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
      HARU_PARAM_AUTO_PREFIXES: HARU_BELIEF
      HARU_BELIEF_DEV_AUTOSTART: "true"
      HARU_BELIEF_USE_SIM_TIME: ${PERCEPTION_USE_SIM_TIME:-false}
      HARU_BELIEF_NAMESPACE: ${HARU_TOPIC_PREFIX:-}/perception/fusion
      ROS_HOME: /ros/haru_perception_data
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/perception
        target: /ros/haru_perception_data
      - *common-dev
    <<: *common-ros
  # haru-viz browser UI + rosbridge runtime
  haru-viz:
    image: ${HARU_VIZ_IMAGE:-ghcr.io/haru-project/haru-viz:feature-asr-improve}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      HARU_VIZ_DEV_AUTOSTART: "true"
      HARU_VIZ_REPO_ROOT: ${HARU_VIZ_REPO_ROOT:-/workspace/haru-viz}
      HARU_VIZ_UI_HOST: ${HARU_VIZ_UI_HOST:-0.0.0.0}
      HARU_VIZ_UI_PORT: ${HARU_VIZ_UI_PORT:-5173}
      HARU_ROSBRIDGE_PORT: ${HARU_ROSBRIDGE_PORT:-9090}
      HARU_ROSBRIDGE_RGB_PORT: ${HARU_ROSBRIDGE_RGB_PORT:-9091}
      HARU_ROSBRIDGE_DEPTH_PORT: ${HARU_ROSBRIDGE_DEPTH_PORT:-9092}
      HARU_ROSBRIDGE_MAX_MESSAGE_SIZE: ${HARU_ROSBRIDGE_MAX_MESSAGE_SIZE:-8388608}
      HARU_RECORDER_RECORDING_ROOT: ${HARU_RECORDER_RECORDING_ROOT:-/root/.local/share/haru_viz/recordings}
      HARU_PARAM__WEB_UI_HOST: ${HARU_VIZ_UI_HOST:-0.0.0.0}
      HARU_PARAM__WEB_UI_PORT: ${HARU_VIZ_UI_PORT:-5173}
      HARU_PARAM__ROSBRIDGE_PORT: ${HARU_ROSBRIDGE_PORT:-9090}
      HARU_PARAM__ROSBRIDGE_RGB_PORT: ${HARU_ROSBRIDGE_RGB_PORT:-9091}
      HARU_PARAM__ROSBRIDGE_DEPTH_PORT: ${HARU_ROSBRIDGE_DEPTH_PORT:-9092}
      HARU_PARAM__ROSBRIDGE_MAX_MESSAGE_SIZE: ${HARU_ROSBRIDGE_MAX_MESSAGE_SIZE:-8388608}
      HARU_PARAM__RECORDING_ROOT: ${HARU_RECORDER_RECORDING_ROOT:-/root/.local/share/haru_viz/recordings}
      VITE_ROSBRIDGE_URL: ws://127.0.0.1:${HARU_ROSBRIDGE_PORT:-9090}
      VITE_ROSBRIDGE_FORCE_AUTO_CONNECT: "1"
      VITE_ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
    network_mode: *network-mode
    restart: unless-stopped
    working_dir: /workspace/haru-viz
    volumes:
      - type: bind
        source: ../../haru-viz
        target: /workspace/haru-viz
      - type: bind
        source: ${HARU_VIZ_HOST_RECORDINGS_DIR:-${HOME}/.local/share/haru_viz/recordings}
        target: ${HARU_RECORDER_RECORDING_ROOT:-/root/.local/share/haru_viz/recordings}
      - *common-dev
    <<: *common-ros
    depends_on:
      haru-belief:
        condition: service_started

  # Resource monitor (optional; no GPU usage required but kept here for convenience)
  resource-monitor:
    image: ${RESOURCE_MONITOR_IMAGE:-ghcr.io/haru-project/strawberry-resource-monitor:latest}
    env_file:
      - ../envs/perception.env
    environment:
      <<: *perception-domain-env
      HARU_TOPIC_PREFIX: ${HARU_TOPIC_PREFIX:-}
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

  perception-domain-bridge:
    image: ${PERCEPTION_DOMAIN_BRIDGE_IMAGE:-ghcr.io/haru-project/haru-domain-bridge-jazzy:latest}
    env_file:
      - ../envs/perception.env
    environment:
      FROM_DOMAIN_ID: ${FROM_DOMAIN_ID:-20}
      TO_DOMAIN_ID: ${TO_DOMAIN_ID:-0}
      DOMAIN_BRIDGE_CONFIG: /shared/config/domain_bridge.yaml
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../config/domain_bridge.yaml
        target: /shared/config/domain_bridge.yaml
        read_only: true
    depends_on:
      haru-belief:
        condition: service_started
    <<: *common-ros

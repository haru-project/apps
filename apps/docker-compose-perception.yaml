# Project name used when docker compose creates the project
name: haru-perception

# Top-level extension fields to deduplicate repeated blocks
x-nvidia-device: &nvidia-device
  driver: nvidia
  count: all
  capabilities: [gpu]

x-gpu-reservations: &gpu-reservations
  resources:
    reservations:
      devices:
        - <<: *nvidia-device

x-common-x11: &common-x11 "/tmp/.X11-unix:/tmp/.X11-unix:rw"

x-common-docker-xauth: &common-docker-xauth "/tmp/.docker.xauth:/tmp/.docker.xauth"

x-common-dev: &common-dev "/dev:/dev:rw"

# Common ROS shutdown behavior
x-common-ros: &common-ros
  init: true
  stop_grace_period: 10s

# Centralized network mode — can be overridden with COMPOSE_NETWORK_MODE env var (e.g. bridge)
x-network-mode: &network-mode ${COMPOSE_NETWORK_MODE:-host}

services:
  # Azure Kinect bridge - supplies depth + color and is relied on by several modules
  azure-kinect:
    image: ghcr.io/haru-project/strawberry-ros-azure-kinect:latest
    env_file:
      - ../envs/perception.env
    environment:
      DISPLAY: ${DISPLAY} # Required by some BT tracking code even when no display is used
      XAUTHORITY: /root/.Xauthority
      HARU_PARAM_AUTO_PREFIXES: AZURE_KINECT
      AZURE_KINECT_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    ipc: host
    privileged: true
    restart: unless-stopped
    volumes:
      - *common-x11
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro # Some BT tracking requires Xauthority even without a display
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

  # Faces (InsightFace + fusion node)
  faces:
    image: ghcr.io/haru-project/strawberry-ros-faces-module:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: FACES
      FACES_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/perception
        target: /ros/strawberry_ros_faces_module
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Hands module
  hands:
    image: ghcr.io/haru-project/strawberry-ros-hands:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: HANDS
      HANDS_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # People module
  people:
    image: ghcr.io/haru-project/strawberry-ros-people:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: PEOPLE
      PEOPLE_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations
    depends_on:
      azure-kinect:
        condition: service_healthy

  # Visualization nodes (RViz, GUI helpers)
  visualization:
    image: ghcr.io/haru-project/strawberry-ros-visualization:latest
    env_file:
      - ../envs/perception.env
    environment:
      HARU_PARAM_AUTO_PREFIXES: VIZ
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      VIZ_DEV_AUTOSTART: "true"
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

  # Resource monitor (optional; no GPU usage required but kept here for convenience)
  resource-monitor:
    image: ghcr.io/haru-project/strawberry-resource-monitor:latest
    network_mode: *network-mode
    restart: unless-stopped
    volumes:
      - *common-x11
      - *common-docker-xauth
      - *common-dev
    <<: *common-ros
    deploy: *gpu-reservations

  register-face:
    image: ghcr.io/haru-project/strawberry_ros_faces_module:latest
    user: "${UID:-1000}:${GID:-1000}"  # Uses environment variables or defaults to 1000:1000
    entrypoint: ["bash", "/home/haru/entrypoint.sh"]
    command: [
      "ros2", "service", "call", "/faces/identities/recognitor/learner/lesson", "strawberry_ros_msgs/srv/FaceLessonSRV",
      "{mode: ${LEARNING_MODE}, person_name: \"${LEARNING_PERSON_NAME}\", person_id: ${LEARNING_PERSON_ID}, number_of_samples: ${LEARNING_NUMBER_OF_SAMPLES}}",
    ]
    env_file: ../envs/perception.env
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth
      - /dev:/dev:rw
      - type: bind
        source: ${ROS_DATA} # Persistent data folder
        target: /home/haru/.ros
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
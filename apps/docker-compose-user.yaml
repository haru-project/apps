name: haru

services:

  episode-builder:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${HARU_EPISODE_BUILDER_IMAGE:-ghcr.io/haru-project/haru-episode-builder@sha256:0d9e9a4be093623ad50e24963ffdc1a877b4dfc9a48b134132f739c6fe22d736}
    env_file: ../envs/user.env
    environment:
      - HARU_DEMO_LANGUAGE=${HARU_DEMO_LANGUAGE:-en-US}
      - PORT=${EPISODE_BUILDER_PORT:-8501}
    ports:
      - "${EPISODE_BUILDER_PORT:-8501}:${EPISODE_BUILDER_PORT:-8501}"
    volumes:
      - ../data/reasoner/tasks/saved:/app/data/tasks/saved:rw
      - ../data/reasoner/tasks/episodes:/app/data/episodes:rw
      - ../data/reasoner/projector:/shared/projector/resources:ro
    restart: unless-stopped

name: haru-llm

services:

  action-args:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_LLM_IMAGE:-ghcr.io/haru-project/haru-llm:feature-expressive_multitts}
    command: [
      "ros2", "launch", "haru_llm_ros", "action_args.launch.py",
      "config_file:=${ACTION_ARGS_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file:
      - ../envs/llm.env
      - path: ../envs/llm.secrets.env
        required: false
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - LLM_SERVER_BASE_URL=http://127.0.0.1:${LLM_SERVER_HOST_PORT:-4050}/v1
    volumes:
      - ../data/llm/configs:/shared/configs:rw
      - ../data/llm/agents:/shared/agents:rw
      - ../data/llm/profling:/opt/ros/jazzy/workspace/install/share/haru_llm_ros/data/profiling
      - ../data/llm/logs:/opt/ros/jazzy/workspace/install/share/haru_llm_ros/data/logs
      - ../data/llm/conversation_logs:/opt/ros/jazzy/workspace/install/share/haru_llm_ros/data/conversation_logs
      # - ../data/llm/profling:/ros2_ws/src/haru-llm/data/profiling
      # - ../data/llm/logs:/ros2_ws/src/haru-llm/data/logs
      # - ../data/llm/conversation_logs:/ros2_ws/src/haru-llm/data/conversation_logs
      # - ../data/llm/agents:/ros2_ws/install/haru_llm_ros/share/haru_llm_ros/agents/
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    
  dashboard:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${HARU_LLM_IMAGE:-ghcr.io/haru-project/haru-llm:feature-expressive_multitts}
    command: ["/bin/bash", "-c", "$PACKAGE_VENV -c 'from haru_llm.dashboard.app import run; run()'"]
    env_file:
      - ../envs/llm.env
      - path: ../envs/llm.secrets.env
        required: false
    ports:
      - ${LLM_DASHBOARD_HOST_PORT:-8501}:8501
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "${PACKAGE_VENV:-/opt/ros/jazzy/workspace/package_venv/bin/python3}", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles: ["dashboard"]
  
  redis:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${LLM_REDIS_IMAGE:-redis:latest}
    ports:
      - ${LLM_REDIS_HOST_PORT:-6379}:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  server:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-stable}
    command:
      - "--config=/app/config.yaml"
    env_file:
      - ../envs/llm.env
      - path: ../envs/llm.secrets.env
        required: false
    ports:
      - ${LLM_SERVER_HOST_PORT:-4050}:4000
    volumes:
      - ../config/llm/litellm_server.yaml:/app/config.yaml:ro
      - ../config/llm/litellm_post_fix.py:/app/litellm_post_fix.py:ro
      # Optional per-agent LLM span logging (OFF). Uncomment these two with the callback in
      # config/llm/litellm_server.yaml and PROFILING_SPANS_PATH below. See profiling/README.md.
      - ../profiling/litellm_agent_spans.py:/app/litellm_agent_spans.py:ro
      - ../profiling/out:/profiling-out:rw
    environment:
      - PROFILING_SPANS_PATH=/profiling-out/agent_spans.jsonl
    restart: unless-stopped
    healthcheck:  # Defines the health check configuration for the container
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2).read()" ]  # Use python (wget/curl not installed)
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  webui:
    extends:
      file: compose.common.yaml
      service: common-service
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    env_file:
      - ../envs/llm.env
      - path: ../envs/llm.secrets.env
        required: false
    ports:
      - ${OPEN_WEBUI_HOST_PORT:-8080}:8080
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/llm/open-webui:/app/backend/data:rw
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    profiles: ["webui"]
  
  vllm:
    extends:
      file: compose.common.yaml
      service: common-gpu
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    # entrypoint: ["/bin/sh", "-c"]
    # command: >
    #   "pip install vllm[audio] && 
    #    vllm serve openai/whisper-large-v3 --port 8000 --gpu-memory-utilization=0.6"
    # command: # remote config
    #   - "--model=${VLLM_MODEL_NAME}"
    #   - "--gpu-memory-utilization=0.9"
    command:
      - "--model=${VLLM_MODEL_NAME}"
      - "--quantization=compressed-tensors"
      - "--limit-mm-per-prompt"
      - '{"image":0,"audio":0,"video":0}'
      - "--reasoning-parser=gemma4"
      - "--tool-call-parser=gemma4"
      - "--served-model-name=gemma4"
      - "--enable-auto-tool-choice"
      - "--no-enforce-eager"
      - "--async-scheduling"
      - "--kv-cache-dtype=fp8_e4m3"
      - "--gpu-memory-utilization=0.6"
      - "--max-model-len=32768"
      - "--max-num-seqs=4"
      - "--tensor-parallel-size=1"
    env_file:
      - ../envs/llm.env
      - path: ../envs/llm.secrets.env
        required: false
    ports:
      - ${VLLM_HOST_PORT:-8000}:8000
    volumes:
      - ${HARU_HF_CACHE_HOST_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface:rw
    restart: unless-stopped
    profiles: ["vllm"]

  llamacpp:
    extends:
      file: compose.common.yaml
      service: common-gpu
    image: ${OLLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda13}
    ports:
      - "8000:8000"
      # google/gemma-4-12B-it-qat-q4_0-gguf
      #reduce --spec-draft-n-max 4 to 2 if quality is sub-par
    command: >
      --hf-repo unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
      --spec-type draft-mtp --spec-draft-n-max 4
      --chat-template-kwargs '{"enable_thinking":false}'
      --host 0.0.0.0 
      --port 8000 
      --n-gpu-layers 99 
      --ctx-size 32000
     
      --no-mmap
      --batch-size 16384
      --ubatch-size 8192
      --parallel 1


      --cache-type-k q4_0 
      --cache-type-v q4_0 
      --warmup 
      --flash-attn on

      --no-prefill-assistant
      --dry-multiplier 0.5
      -lv 3
      --reasoning off
      --reasoning-budget 0
    # --no-mmproj
    environment:
      - GGML_CUDA_GRAPH_OPT=1
      
    volumes:
      - ${HARU_HF_CACHE_HOST_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface:rw
    restart: unless-stopped
    profiles: ["llamacpp"]
name: haru-recorder
services:
  recorder:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_RECORDER_IMAGE:-ghcr.io/haru-project/haru-recorder:feature-standalone-recording}
    env_file: ../envs/recorder.env
    environment:
      ROS_DOMAIN_ID: ${HARU_RECORDER_CONTROL_DOMAIN:-${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}}
      HARU_ROBOT_ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
      HARU_PERCEPTION_ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_RECORDER_DOMAINS: '[${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}},${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}]'
      HARU_RECORDER_PROTECTED_DOMAINS: '[${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}},${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}]'
      HARU_RECORDER_RECORDING_ROOT: /recordings
    volumes:
      - ${HARU_RECORDER_HOST_RECORDINGS_DIR:-${HOME}/.local/share/haru-recorder}:/recordings:rw

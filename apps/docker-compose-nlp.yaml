networks:
  haru-nlp-server:
    name: haru-nlp-server

services:
  loki:
    image: 'grafana/loki:2.9.3'
    command: '-config.file=/etc/loki/local-config.yaml'
    ports:
    - '3100:3100'
    networks:
    - haru-nlp-server
    profiles: ["gpu", "cpu", "all"]

  prometheus:
    image: 'prom/prometheus:v2.48.1'
    ports:
    - '9090:9090'
    volumes:
    - './etc/prometheus:/workspace'
    command:
    - '--config.file=/workspace/prometheus.yml'
    - '--enable-feature=exemplar-storage'
    depends_on:
    - loki
    networks:
    - haru-nlp-server
    logging:
      driver: loki
      options:
        loki-url: 'http://localhost:3100/api/prom/push'
        loki-timeout: 3s
        loki-max-backoff: 10s
        loki-retries: 3
        loki-pipeline-stages: |
          - multiline:
              firstline: '^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2}'
              max_wait_time: 3s
          - regex:
              expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},d{3}) (?P<message>(?s:.*))$$'
    profiles: ["gpu", "all"]


  tempo:
    image: 'grafana/tempo:2.3.1'
    command:
    - '--target=all'
    - '--storage.trace.backend=local'
    - '--storage.trace.local.path=/var/tempo'
    - '--auth.enabled=false'
    ports:
    - '4317:4317'
    - '4318:4318'
    networks:
    - haru-nlp-server
    depends_on:
    - loki
    logging:
      driver: loki
      options:
        loki-url: 'http://localhost:3100/api/prom/push'
        loki-timeout: 3s
        loki-max-backoff: 10s
        loki-retries: 3
        loki-pipeline-stages: |
          - multiline:
              firstline: '^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2}'
              max_wait_time: 3s
          - regex:
              expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},d{3}) (?P<message>(?s:.*))$$'
    profiles: ["gpu", "all"]



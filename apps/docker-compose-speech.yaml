name: haru-speech

services:
  download-models:
    image: ${HARU_SPEECH_BASE_IMAGE:-ghcr.io/haru-project/haru-speech-base:feature-asr-improve}
    working_dir: /ros2_ws/src/haru-speech
    command: ["/bin/bash", "-c", "/root/.local/bin/uv pip install --python $PACKAGE_VENV --upgrade pip && $PACKAGE_VENV -m haru_speech.models.download"]
    env_file: ../envs/speech.env
    volumes:
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
    profiles: ["setup"]
  
  clear-models:
    image: ${HARU_SPEECH_BASE_IMAGE:-ghcr.io/haru-project/haru-speech-base:feature-asr-improve}
    working_dir: /ros2_ws/src/haru-speech
    command: ["/bin/bash", "-c", "/root/.local/bin/uv pip install --python $PACKAGE_VENV --upgrade pip && $PACKAGE_VENV -m haru_speech.models.clear"]
    env_file: ../envs/speech.env
    volumes:
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
    profiles: ["setup"]

  audio:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio:feature-asr-improve}
    command: [
      "ros2", "launch", "haru_speech", "audio_capture.launch.py",
      "config_file:=${AUDIO_CONFIG_FILE}",
      "capture_mode:=${AUDIO_CAPTURE_MODE:-multi_device}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
    restart: unless-stopped

  audio-capture-manager:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio:feature-asr-improve}
    command: [
      "ros2", "launch", "haru_speech", "audio_capture.launch.py",
      "config_file:=${AUDIO_CONFIG_FILE}",
      "capture_mode:=manager",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
    profiles: ["multi-audio"]
    restart: unless-stopped

  recognition:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_RECOGNITION_IMAGE:-ghcr.io/haru-project/haru-speech-recognition:feature-asr-improve}
    command: [
      "ros2", "launch", "haru_speech", "speech_to_text.launch.py",
      "config_file:=${SPEECH_RECOGNITION_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
    restart: unless-stopped
    
  verification:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_VERIFICATION_IMAGE:-ghcr.io/haru-project/haru-speech-verification:feature-asr-improve}
    command: [
      "ros2", "launch", "haru_speech", "speaker_verification.launch.py",
      "config_file:=${SPEAKER_VERIFICATION_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
      - ~/haru-speech-cache/voices:${HARU_SPEECH_VOICES_DIR}:rw
    restart: unless-stopped
    
  localization:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_LOCALIZATION_IMAGE:-ghcr.io/haru-project/haru-speech-localization:feature-asr-improve}
    command: [
      "ros2", "launch", "haru_speech", "sound_localization.launch.py",
      "config_file:=${SOUND_LOCALIZATION_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
    restart: unless-stopped

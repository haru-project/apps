name: haru-speech

services:
  base:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_BASE_IMAGE:-ghcr.io/haru-project/haru-speech-base@sha256:152d851f5e9899f7ebe277bb98f732cab575d37323352619b013ce6cb7b335f4}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${BASE_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_STATE_DIR:-${HOME}/.ros/haru_speech}:/shared/state/haru_speech:rw
    profiles: ["monolithic"]
    restart: unless-stopped
  audio:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio@sha256:15c38d549b6a31ee1c8f363267b155e21a147033dbe1ae329828af0fcbdd02d2}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${AUDIO_CONFIG_FILE}
      HARU_PARAM__AUDIO_CAPTURE_MODE: ${AUDIO_CAPTURE_MODE:-multi_device}
      HARU_PARAM__STATE_FILE: ${AUDIO_CAPTURE_STATE_FILE:-/shared/state/haru_speech/audio_capture_state.yaml}
      HARU_PARAM__DEV_AUTOSTART: "true"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_STATE_DIR:-${HOME}/.ros/haru_speech}:/shared/state/haru_speech:rw
    restart: unless-stopped

  audio-capture-manager:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio@sha256:15c38d549b6a31ee1c8f363267b155e21a147033dbe1ae329828af0fcbdd02d2}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${AUDIO_CONFIG_FILE}
      HARU_PARAM__AUDIO_CAPTURE_MODE: manager
      HARU_PARAM__STATE_FILE: ${AUDIO_CAPTURE_STATE_FILE:-/shared/state/haru_speech/audio_capture_state.yaml}
      HARU_PARAM__DEV_AUTOSTART: "true"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_STATE_DIR:-${HOME}/.ros/haru_speech}:/shared/state/haru_speech:rw
    profiles: ["multi-audio"]
    restart: unless-stopped

  recognition:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_RECOGNITION_IMAGE:-ghcr.io/haru-project/haru-speech-recognition@sha256:28e418906774d2f816b9913dc7b5f966aa659229deac3fb705a155e7994ab9c6}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${SPEECH_RECOGNITION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
      HARU_PARAM__ENABLE_VERIF: "false"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_MODELS_HOST_DIR:-${HOME}/haru-speech-cache/models}:${HARU_SPEECH_MODELS_DIR}:rw
    restart: unless-stopped
    
  verification:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_VERIFICATION_IMAGE:-ghcr.io/haru-project/haru-speech-verification@sha256:461e06a140ada45c2e14232fd52f4cddbcacb7aa7c2473addb86548871cc71c5}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${SPEAKER_VERIFICATION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_MODELS_HOST_DIR:-${HOME}/haru-speech-cache/models}:${HARU_SPEECH_MODELS_DIR}:rw
      - ${HARU_SPEECH_VOICES_HOST_DIR:-${HOME}/haru-speech-cache/voices}:${HARU_SPEECH_VOICES_DIR}:rw
    restart: unless-stopped
    
  localization:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_LOCALIZATION_IMAGE:-ghcr.io/haru-project/haru-speech-localization@sha256:bf194c90f417d65dead83df53a771d209eec6ea93942cf56680d8ec243e031ea}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${SOUND_LOCALIZATION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_MODELS_HOST_DIR:-${HOME}/haru-speech-cache/models}:${HARU_SPEECH_MODELS_DIR}:rw
    profiles: ["ssl"]
    restart: unless-stopped

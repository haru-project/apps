name: haru-speech

services:
  download-models:
    image: ghcr.io/haru-project/haru-speech:ros2
    working_dir: /ros2_ws/src/haru-speech
    command: ["uv", "run", "download-models"]
    volumes:
      - ~/haru-speech-cache/models:/shared/models
    profiles: ["setup"]
  
  clear-models:
    image: ghcr.io/haru-project/haru-speech:ros2
    working_dir: /ros2_ws/src/haru-speech
    command: ["uv", "run", "clear-models"]
    volumes:
      - ~/haru-speech-cache/models:/shared/models
    profiles: ["setup"]

  audio:
    image: ghcr.io/haru-project/haru-speech:ros2
    command: [
      "ros2", "launch", "haru_speech_ros", "audio.launch.py",
      "config_file:=${AUDIO_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    network_mode: host
    ipc: host
    devices:
      - /dev/snd
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/speech/configs:/ros2_ws/src/haru-speech/configs:rw
    restart: unless-stopped

  configure:
    image: ghcr.io/haru-project/haru-speech:ros2
    command: [
      "ros2", "launch", "haru_speech_ros", "configure.launch.py",
      "config_file:=${AUDIO_CONFIGURE_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/speech/configs:/ros2_ws/src/haru-speech/configs:rw
    restart: unless-stopped
  
  speech-recognition:
    image: ghcr.io/haru-project/haru-speech:ros2
    command: [
      "ros2", "launch", "haru_speech_ros", "speech_to_text.launch.py",
      "config_file:=${SPEECH_RECOGNITION_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/speech/configs:/ros2_ws/src/haru-speech/configs:rw
      - ~/haru-speech-cache/models:/shared/models:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    
  speaker-verification:
    image: ghcr.io/haru-project/haru-speech:ros2
    command: [
      "ros2", "launch", "haru_speech_ros", "speaker_verification.launch.py",
      "config_file:=${SPEAKER_VERIFICATION_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/speech/configs:/ros2_ws/src/haru-speech/configs:rw
      - ~/haru-speech-cache/voices:/shared/voices:rw
      - ~/haru-speech-cache/models:/shared/models:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    
  sound-localization:
    image: ghcr.io/haru-project/haru-speech:ros2
    command: [
      "ros2", "launch", "haru_speech_ros", "sound_localization.launch.py",
      "config_file:=${SOUND_LOCALIZATION_CONFIG_FILE}",
      "dev_autostart:=true",
    ]
    env_file: ../envs/speech.env
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../data/speech/configs:/ros2_ws/src/haru-speech/configs:rw
      - ~/haru-speech-cache/models:/shared/models:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
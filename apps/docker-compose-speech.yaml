name: haru-speech

services:
  audio:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio:feature-asr-improve}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
      HARU_PARAM__CONFIG_FILE: ${AUDIO_CONFIG_FILE}
      HARU_PARAM__AUDIO_CAPTURE_MODE: ${AUDIO_CAPTURE_MODE:-multi_device}
      HARU_PARAM__DEV_AUTOSTART: "true"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
    restart: unless-stopped

  audio-capture-manager:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio:feature-asr-improve}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
      HARU_PARAM__CONFIG_FILE: ${AUDIO_CONFIG_FILE}
      HARU_PARAM__AUDIO_CAPTURE_MODE: manager
      HARU_PARAM__DEV_AUTOSTART: "true"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
    profiles: ["multi-audio"]
    restart: unless-stopped

  recognition:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_RECOGNITION_IMAGE:-ghcr.io/haru-project/haru-speech-recognition:feature-asr-improve}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
      HARU_PARAM__CONFIG_FILE: ${SPEECH_RECOGNITION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
    restart: unless-stopped
    
  verification:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_VERIFICATION_IMAGE:-ghcr.io/haru-project/haru-speech-verification:feature-asr-improve}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
      HARU_PARAM__CONFIG_FILE: ${SPEAKER_VERIFICATION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
      - ~/haru-speech-cache/voices:${HARU_SPEECH_VOICES_DIR}:rw
    restart: unless-stopped
    
  localization:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_LOCALIZATION_IMAGE:-ghcr.io/haru-project/haru-speech-localization:feature-asr-improve}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-20}
      HARU_PARAM__CONFIG_FILE: ${SOUND_LOCALIZATION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ~/haru-speech-cache/models:${HARU_SPEECH_MODELS_DIR}:rw
    restart: unless-stopped

name: haru-speech

#speech backups

# ""
# ghcr.io/haru-project/haru-speech-audio:feature-asr-improve
#                                 3cbe3e959ccf         15GB         5.11GB        
# ghcr.io/haru-project/haru-speech-base:feature-asr-improve
#                                 fb3695f30575       15.8GB         5.34GB        
# ghcr.io/haru-project/haru-speech-localization:feature-asr-improve
#                                 4f6908ea9c4e         15GB         5.15GB        
# ghcr.io/haru-project/haru-speech-recognition:feature-asr-improve
#                                 db7f97e44242       15.4GB         5.19GB        
# ghcr.io/haru-project/haru-speech-verification:feature-asr-improve
#                                 277c31dae5c0       14.6GB         5.02GB
# ""

services:
  base:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_BASE_IMAGE:-ghcr.io/haru-project/haru-speech-base:feature-adaptive-microphone-gain}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${BASE_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_STATE_DIR:-${HOME}/.ros/haru_speech}:/shared/state/haru_speech:rw
    profiles: ["monolithic"]
    restart: unless-stopped
  audio:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio:feature-adaptive-microphone-gain}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${AUDIO_CONFIG_FILE}
      HARU_PARAM__AUDIO_CAPTURE_MODE: ${AUDIO_CAPTURE_MODE:-multi_device}
      HARU_PARAM__STATE_FILE: ${AUDIO_CAPTURE_STATE_FILE:-/shared/state/haru_speech/audio_capture_state.yaml}
      HARU_PARAM__DEV_AUTOSTART: "true"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_STATE_DIR:-${HOME}/.ros/haru_speech}:/shared/state/haru_speech:rw
    restart: unless-stopped

  audio-capture-manager:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${HARU_SPEECH_AUDIO_IMAGE:-ghcr.io/haru-project/haru-speech-audio:feature-adaptive-microphone-gain}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${AUDIO_CONFIG_FILE}
      HARU_PARAM__AUDIO_CAPTURE_MODE: manager
      HARU_PARAM__STATE_FILE: ${AUDIO_CAPTURE_STATE_FILE:-/shared/state/haru_speech/audio_capture_state.yaml}
      HARU_PARAM__DEV_AUTOSTART: "true"
    device_cgroup_rules:
      - "c 116:* rmw"
    volumes:
      - /dev/snd:/dev/snd:rw
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_STATE_DIR:-${HOME}/.ros/haru_speech}:/shared/state/haru_speech:rw
    profiles: ["multi-audio"]
    restart: unless-stopped

  recognition:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_RECOGNITION_IMAGE:-ghcr.io/haru-project/haru-speech-recognition:feature-adaptive-microphone-gain}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${SPEECH_RECOGNITION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
      HARU_PARAM__ENABLE_VERIF: "false"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_MODELS_HOST_DIR:-${HOME}/haru-speech-cache/models}:${HARU_SPEECH_MODELS_DIR}:rw
    restart: unless-stopped
    
  verification:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_VERIFICATION_IMAGE:-ghcr.io/haru-project/haru-speech-verification:feature-adaptive-microphone-gain}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${SPEAKER_VERIFICATION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_MODELS_HOST_DIR:-${HOME}/haru-speech-cache/models}:${HARU_SPEECH_MODELS_DIR}:rw
      - ${HARU_SPEECH_VOICES_HOST_DIR:-${HOME}/haru-speech-cache/voices}:${HARU_SPEECH_VOICES_DIR}:rw
    restart: unless-stopped
    
  localization:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${HARU_SPEECH_LOCALIZATION_IMAGE:-ghcr.io/haru-project/haru-speech-localization:feature-adaptive-microphone-gain}
    env_file: ../envs/speech.env
    environment:
      ROS_DOMAIN_ID: ${HARU_PERCEPTION_ROS_DOMAIN_ID:-200}
      HARU_PARAM__CONFIG_FILE: ${SOUND_LOCALIZATION_CONFIG_FILE}
      HARU_PARAM__DEV_AUTOSTART: "true"
    volumes:
      - ../data/speech/configs:/shared/configs:rw
      - ${HARU_SPEECH_MODELS_HOST_DIR:-${HOME}/haru-speech-cache/models}:${HARU_SPEECH_MODELS_DIR}:rw
    profiles: ["ssl"]
    restart: unless-stopped

name: haru-tts

services:

  tts-client:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${STRAWBERRY_TTS_IMAGE:-ghcr.io/haru-project/strawberry-tts:v0.3.2}
    entrypoint: ["bash", "-c", "source /ros2_ws/src/strawberry_tts/.venv/bin/activate && exec \"$@\""]
    command: [
      "python",
      "/ros2_ws/src/strawberry_tts/src/strawberry_tts/client/fastapi_client_wrapper.py",
      "--model_ver", "mixed",
      "--weights_dir", "/tts",
      "--json_path", "/ros2_ws/src/strawberry_tts/ref_audio/refs.json",
      "--config_path", "/ros2_ws/src/strawberry_tts/src/strawberry_tts/configs/params.json",
      "--ref_dir", "/tts/ref_audio",
      "--max_syllable_dur", "250.0",
      "--sr", "32000",
      "--num_retries", "1",
      "--global_timeout", "4.0",
      "--weights_json", "/ros2_ws/src/strawberry_tts/weight_refs_mixed.json",
      "--voice_gesture_dir", "/ros2_ws/src/strawberry_tts/voice_gestures",
      "--retry_mos_thresh", "2.7",
      "--fallback_mos_thresh", "1.5",
      "--silence_percentile", "50.0",
      "--gptsovits_url", "http://127.0.0.1:9880",
      "--cerevoice_url", "http://127.0.0.1:8015",
      "--timeout", "3.0",
      "--languages", "en-US", "ja-JP",
      "--default_language_code", "en-US",
      "--cerevoice_langs", "en-US",
      "--base_model_dir", "/workspace/GPT-SoVITS/GPT_SoVITS/pretrained_models",
      "--lipsync_window_size", "32",
      "--lipsync_threshold_percentile", "90",
      # "--base_weight_fallback",
      "--genre_weights",
      "--extended_code_switching"
    ]
    env_file: ../envs/tts.env
    depends_on:
      gpt-sovits:
        condition: service_healthy
      cerevoice-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f fastapi_client_wrapper.py >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["tts", "all"]

  ros-node:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${STRAWBERRY_TTS_IMAGE:-ghcr.io/haru-project/strawberry-tts:v0.3.2}
    command: ["ros2", "launch", "strawberry_tts_ros", "strawberry_ros_tts_img_lite_launch.py"]
    env_file: ../envs/tts.env
    volumes:
      - ../data/tts/configs:/ros2_ws/src/strawberry_tts/configs
      - ../data/tts/ref_audio:/ros2_ws/src/strawberry_tts/ref_audio
      - ../data/tts/weight_refs_mixed.json:/ros2_ws/src/strawberry_tts/weight_refs_mixed.json
    depends_on:
      tts-client:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 service list 2>/dev/null | grep -qx /strawberry/retrieve_tts_generation'"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
    profiles: ["ros", "all"]

  cerevoice-api:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ${STRAWBERRY_TTS_IMAGE:-ghcr.io/haru-project/strawberry-tts:v0.3.2}
    command: ["/bin/bash", "-c", "cd /ros2_ws/src/strawberry_tts/src/cerevoice && . .venv/bin/activate && python cerevoice_api_server.py"]
    env_file: ../envs/tts.env
    ports:
      - "${CEREVOICE_HOST_PORT:-8015}:8015"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"echo > /dev/tcp/127.0.0.1/8015\""]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["tts", "all"]

  gpt-sovits:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ${STRAWBERRY_TTS_API_IMAGE:-ghcr.io/strawberry-tts-api:v0.3.2-cu126}
    working_dir: /workspace/GPT-SoVITS
    volumes:
      - ../data/tts/configs/pronunciation_dict.rep:/workspace/GPT-SoVITS/GPT_SoVITS/text/engdict-hot.rep
      - ../data/tts/ref_audio:/tts/ref_audio
      - ../data/tts/GPT_weights_mixed:/tts/GPT_weights_mixed
      - ../data/tts/SoVITS_weights_mixed:/tts/SoVITS_weights_mixed
    ports:
      - "${GPT_SOVITS_HOST_PORT:-9880}:9880"
      - "${GPT_SOVITS_AUX1_HOST_PORT:-9871}:9871"
      - "${GPT_SOVITS_AUX2_HOST_PORT:-9872}:9872"
      - "${GPT_SOVITS_AUX3_HOST_PORT:-9873}:9873"
      - "${GPT_SOVITS_AUX4_HOST_PORT:-9874}:9874"
      - "${TTS_API_HOST_PORT:-8022}:8022"
    environment:
      - is_half=False
      - is_share=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"echo > /dev/tcp/127.0.0.1/9880\""]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["tts", "all"]

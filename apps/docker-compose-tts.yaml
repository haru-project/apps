name: haru-tts

services:

  tts-client:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ghcr.io/haru-project/strawberry-tts:ros2
    entrypoint: ["bash", "-c", "source /ros2_ws/src/strawberry_tts/.venv/bin/activate && exec \"$@\""]
    command: [
      "python",
      "/ros2_ws/src/strawberry_tts/src/strawberry_tts/client/fastapi_client_wrapper.py",
      "--global_timeout", "9.0",
      "--timeout", "4.0",
      "--num_retries", "2"
    ]
    env_file: ../envs/tts.env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      gpt-sovits:
        condition: service_healthy
      cerevoice-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f fastapi_client_wrapper.py >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["tts"]

  ros-node:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ghcr.io/haru-project/strawberry-tts:ros2
    command: ["ros2", "launch", "strawberry_tts_ros", "strawberry_ros_tts_img_lite_launch.py"]
    env_file: ../envs/tts.env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      tts-client:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["ros"]

  cerevoice-api:
    extends:
      file: compose.common.yaml
      service: common-ros
    image: ghcr.io/haru-project/strawberry-tts:ros2
    command: ["/bin/bash", "-c", "cd /ros2_ws/src/strawberry_tts/src/cerevoice && . .venv/bin/activate && python cerevoice_api_server.py"]
    env_file: ../envs/tts.env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"echo > /dev/tcp/127.0.0.1/8015\""]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["tts"]

  gpt-sovits:
    extends:
      file: compose.common.yaml
      service: common-ros-gpu
    image: ghcr.io/haru-project/strawberry-tts-api:latest
    working_dir: /workspace
    environment:
      - is_half=False
      - is_share=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"echo > /dev/tcp/127.0.0.1/9880\""]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["tts"]

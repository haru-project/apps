name: haru-all

services:
  # ROS domain bridge
  domain-bridge:
    extends:
      file: docker-compose-domain-bridge.yaml
      service: domain-bridge

  # Perception layer
  azure-kinect:
    extends:
      file: docker-compose-perception.yaml
      service: azure-kinect
    profiles: ["physical"]

  faces:
    extends:
      file: docker-compose-perception.yaml
      service: faces
    profiles: ["physical"]

  skeletons:
    extends:
      file: docker-compose-perception.yaml
      service: skeletons
    profiles: ["physical"]

  belief:
    extends:
      file: docker-compose-perception.yaml
      service: belief

  viz:
    extends:
      file: docker-compose-perception.yaml
      service: viz

  # Speech layer
  base:
    extends:
      file: docker-compose-speech.yaml
      service: base

  audio:
    extends:
      file: docker-compose-speech.yaml
      service: audio
    profiles: !override []

  audio-capture-manager:
    extends:
      file: docker-compose-speech.yaml
      service: audio-capture-manager

  recognition:
    extends:
      file: docker-compose-speech.yaml
      service: recognition
    depends_on:
      audio:
        condition: service_started

  verification:
    extends:
      file: docker-compose-speech.yaml
      service: verification
    depends_on:
      audio:
        condition: service_started

  localization:
    extends:
      file: docker-compose-speech.yaml
      service: localization
    depends_on:
      audio:
        condition: service_started
    profiles: !override []

  # LLM layer
  redis:
    extends:
      file: docker-compose-llm.yaml
      service: redis

  server:
    extends:
      file: docker-compose-llm.yaml
      service: server

  dashboard:
    extends:
      file: docker-compose-llm.yaml
      service: dashboard
    profiles: ["dashboard"]

  action-args:
    extends:
      file: docker-compose-llm.yaml
      service: action-args
    environment:
      ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
      recognition:
        condition: service_started

  webui:
    extends:
      file: docker-compose-llm.yaml
      service: webui

  vllm:
    extends:
      file: docker-compose-llm.yaml
      service: vllm

  # Memory layer
  agent-memory-t2v:
    extends:
      file: docker-compose-memory.yaml
      service: agent-memory-t2v

  agent-memory-weaviate:
    extends:
      file: docker-compose-memory.yaml
      service: agent-memory-weaviate

  agent-memory:
    extends:
      file: docker-compose-memory.yaml
      service: agent-memory

  agent-memory-dashboard:
    extends:
      file: docker-compose-memory.yaml
      service: agent-memory-dashboard

  # Reasoner layer
  bt-forest:
    extends:
      file: docker-compose-reasoner.yaml
      service: bt-forest
    environment:
      ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
    depends_on:
      action-args:
        condition: service_started

  reasoner:
    extends:
      file: docker-compose-reasoner.yaml
      service: reasoner
    environment:
      ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}

  context-manager:
    extends:
      file: docker-compose-reasoner.yaml
      service: context-manager
    environment:
      ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}

  execute-task-scenario:
    extends:
      file: docker-compose-reasoner.yaml
      service: execute-task-scenario
    environment:
      ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
    profiles: ["scenario"]

  execute-task-test:
    extends:
      file: docker-compose-reasoner.yaml
      service: execute-task-test
    environment:
      ROS_DOMAIN_ID: ${HARU_ROBOT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
    profiles: ["test"]

  # Expressive TTS is part of the core demo.
  gpt-sovits:
    extends:
      file: docker-compose-tts.yaml
      service: gpt-sovits
    profiles: []

  cerevoice-api:
    extends:
      file: docker-compose-tts.yaml
      service: cerevoice-api
    profiles: []

  tts-client:
    extends:
      file: docker-compose-tts.yaml
      service: tts-client
    depends_on:
      gpt-sovits:
        condition: service_healthy
      cerevoice-api:
        condition: service_healthy
      action-args:
        condition: service_started
    profiles: []

  ros-node:
    extends:
      file: docker-compose-tts.yaml
      service: ros-node
    profiles: []

  # Simulator (optional)
  unity-app:
    extends:
      file: docker-compose-simulator.yaml
      service: unity-app
    profiles: ["simulator"]

  web-server:
    extends:
      file: docker-compose-simulator.yaml
      service: web-server
    profiles: ["simulator"]

  # Optional user-facing applications
  ipad-server:
    extends:
      file: docker-compose-ipad.yaml
      service: server
    profiles: ["ipad"]

  projector-server:
    extends:
      file: docker-compose-projector.yaml
      service: server
    profiles: ["projector"]

  episode-builder:
    extends:
      file: docker-compose-user.yaml
      service: episode-builder
    profiles: ["episode-builder"]

  # Local NLP layer. HARU_NLP_SERVER_GPU_ENABLED selects one server profile.
  nlp-redis:
    extends:
      file: docker-compose-nlp.yaml
      service: redis

  haru-nlp-server-cpu:
    extends:
      file: docker-compose-nlp.yaml
      service: haru-nlp-server-cpu
    environment:
      HARU_NLP_SERVER_REDIS_HOST: nlp-redis
    depends_on: !override
      nlp-redis:
        condition: service_healthy

  haru-nlp-server-gpu:
    extends:
      file: docker-compose-nlp.yaml
      service: haru-nlp-server-gpu
    environment:
      HARU_NLP_SERVER_REDIS_HOST: nlp-redis
    depends_on: !override
      nlp-redis:
        condition: service_healthy

  # Compatibility service for robots that do not yet provide the action.
  timeline-player:
    extends:
      file: docker-compose-timeline-player.yaml
      service: timeline-player
    profiles: ["timeline-compat"]

  timeline-player-dev:
    extends:
      file: docker-compose-timeline-player.yaml
      service: dev
    profiles: ["dev"]

volumes:
  agent_memory_weaviate_data:

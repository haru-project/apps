# Explicit allowlist for isolated perception deployments.
# The compose service invokes this as --from perception --to robot. Entries with
# `reversed: true` are robot -> perception so haru-viz can see low-bandwidth
# robot/speech/belief state without moving raw camera streams.
name: haru_domain_bridge
from_domain: 0
to_domain: 0

topics:
  /perception/proc/faces:
    type: strawberry_ros_msgs/msg/Faces
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/skeletons:
    type: strawberry_ros_msgs/msg/Skeletons
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/sensor/camera/kinect/cam_1/camera_info:
    type: sensor_msgs/msg/CameraInfo
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /tf:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 100

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1

  /perception/proc/speech/asr/status_array:
    type: haru_speech_msgs/msg/SpeechStatusArray
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/asr/result:
    type: haru_speech_msgs/msg/SpeechToTextResult
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/asr/result_revision:
    type: haru_speech_msgs/msg/SpeechToTextRevision
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/localization:
    type: haru_speech_msgs/msg/SoundSourceLocalization
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/control/state:
    type: haru_speech_msgs/msg/SpeechControlState
    reversed: true
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1

  /perception/sensor/audio/capture/state:
    type: haru_speech_msgs/msg/AudioCaptureState
    reversed: true
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1

  /perception/sensor/audio/kinect/array:
    type: haru_speech_msgs/msg/AudioData
    reversed: true
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /perception/sensor/audio/kinect:
    type: haru_speech_msgs/msg/AudioData
    reversed: true
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /perception/status/audio/status:
    type: haru_speech_msgs/msg/AudioSourceStatus
    reversed: true
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /perception/status/audio/info:
    type: haru_speech_msgs/msg/AudioSourceInfo
    reversed: true
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 10

  /perception/fusion/persons:
    type: haru_belief_msgs/msg/PersonsState
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/speech_sources:
    type: haru_belief_msgs/msg/SoundSourceAttributionArray
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /strawberry/people:
    type: strawberry_ros_msgs/msg/People
    reversed: true
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

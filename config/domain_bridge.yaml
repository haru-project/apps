# One-way bridge for robot-domain consumers of low-bandwidth perception outputs.
#
# `/perception/...` publishers and services are authoritative in the perception
# domain. This bridge mirrors selected speech and belief outputs into the
# robot domain for application consumers that still run with ROS_DOMAIN_ID=0. It
# does not bridge raw camera streams, raw audio, speech services, or belief
# services. `/tf` and `/tf_static` are bridged because robot-domain
# agent_reasoner fusion gazing resolves head and robot transforms there.
name: haru_domain_bridge
from_domain: 200
to_domain: 12

topics:
  /tf:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 100

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1

  /perception/proc/speech/asr/status_array:
    type: haru_speech_msgs/msg/SpeechStatusArray
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/asr/result:
    type: haru_speech_msgs/msg/SpeechToTextResult
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/speech/asr/status_array:
    type: haru_speech_msgs/msg/SpeechStatusArray
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/speech/asr/result:
    type: haru_speech_msgs/msg/SpeechToTextResult
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/asr/result_revision:
    type: haru_speech_msgs/msg/SpeechToTextRevision
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/proc/speech/localization:
    type: haru_speech_msgs/msg/SoundSourceLocalization
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/persons:
    type: haru_belief_msgs/msg/PersonsState
    qos:
      reliability: best_effort
      history: keep_last
      depth: 10

  /perception/fusion/speech_sources:
    type: haru_belief_msgs/msg/SoundSourceAttributionArray
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/context:
    type: haru_belief_msgs/msg/Context
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/robot:
    type: haru_belief_msgs/msg/RobotState
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/things:
    type: haru_belief_msgs/msg/ThingsState
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/things/tf:
    type: haru_belief_msgs/msg/ThingTfArray
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

  /perception/fusion/environment:
    type: haru_belief_msgs/msg/EnvironmentState
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1

  /strawberry/people:
    type: strawberry_ros_msgs/msg/People
    qos:
      reliability: reliable
      history: keep_last
      depth: 10

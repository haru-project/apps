- model_name: haru:canonical
  litellm_params:
    model: openai/gemma-4-26b
    api_base: http://172.24.36.28:4000/v1
    api_key: unused
    temperature: 1.0
    top_p: 0.95
litellm_settings:
  drop_params: true
  callbacks: [litellm_post_fix.proxy_handler_instance]
  # Session profiling (OFF by default). To capture per-agent LLM spans, add
  # litellm_agent_spans.proxy_handler_instance to the callbacks list above AND uncomment the
  # profiling mount in apps/docker-compose-llm.yaml — the module comes from there.
  # See profiling/README.md.

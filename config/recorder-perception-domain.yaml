haru_recorder:
  ros__parameters:
    record_all_topics: true
    topic_allowlist: []
    topic_denylist: []
    node_allowlist: []
    node_denylist: []
    topic_regex: ""
    include_hidden_topics: false
    output_dir: /root/.local/share/haru_recorder/domains/perception
    session_id: ""
    bag_storage_id: "mcap"
    bag_compression_format: "zstd"
    bag_compression_mode: "file"
    max_bag_size_mb: 0
    max_bag_duration_s: 0
    prefer_compressed_images: true
    compressed_suffixes: ["/compressed"]
    image_record_mode: mp4
    image_video_codec: h264
    image_video_bitrate_mbps: 8.0
    image_video_fps: 30.0
    image_video_out_dir: "${output_dir}/${session_id}/video"
    image_video_preset: p4
    record_rosout: true
    rosout_log_dir: "${output_dir}/${session_id}/logs"
    rosout_format: "jsonl"
    upload_enabled: true
    s3_bucket: ""
    s3_prefix: "haru-recorder/perception/${session_id}"
    s3_region: ""
    s3_endpoint_url: ""
    cloudwatch_enabled: true
    cloudwatch_log_group: "haru-recorder"
    cloudwatch_stream_prefix: "perception/${session_id}"
    delete_after_upload: false
    retention_days: 0
